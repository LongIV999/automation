<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1350px;
            font-family: Georgia, serif;

            background: {
                    {
                    background
                }
            }

            ;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px;
            position: relative;
            overflow: hidden;
        }

        .accent-line {
            position: absolute;
            width: 8px;
            height: 280px;

            background: {
                    {
                    accent
                }
            }

            ;
            left: 80px;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 4px;
        }

        .header {
            position: absolute;
            top: 80px;
            left: 100px;
            display: flex;
            align-items: center;
        }

        .logo-text {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 36px;

            color: {
                    {
                    text
                }
            }

            ;
        }

        .quote-container {
            text-align: center;
            max-width: 880px;
            z-index: 1;
        }

        .quote-text {
            font-family: Georgia, serif;
            font-size: 56px;
            font-style: italic;
            line-height: 1.35;

            color: {
                    {
                    text
                }
            }

            ;
            margin-bottom: 60px;
        }

        .author {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 48px;

            color: {
                    {
                    accent
                }
            }

            ;
            margin-bottom: 16px;
        }

        .author-title {
            font-family: 'Roboto', sans-serif;
            font-size: 36px;

            color: {
                    {
                    secondary
                }
            }

            ;
        }

        .divider {
            width: 120px;
            height: 6px;

            background: {
                    {
                    accent
                }
            }

            ;
            margin: 56px auto;
            border-radius: 3px;
        }

        .footer {
            position: absolute;
            bottom: 80px;
            left: 100px;
            right: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .watermark {
            font-family: 'Roboto', sans-serif;
            font-size: 28px;

            color: {
                    {
                    secondary
                }
            }

            ;
        }

        .topic-tag {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;

            color: {
                    {
                    accent
                }
            }

            ;
            background: rgba(193, 95, 60, 0.1);
            padding: 14px 32px;
            border-radius: 28px;
        }
    </style>
</head>

<body>
    <div class="accent-line"></div>

    <div class="header">
        <span class="logo-text">{{brandName}}</span>
    </div>

    <div class="quote-container">
        <p class="quote-text">"{{quoteText}}"</p>
        <div class="divider"></div>
        <p class="author">{{author}}</p>
        {{#if authorTitle}}
        <p class="author-title">{{authorTitle}}</p>
        {{/if}}
    </div>

    <div class="footer">
        <span class="watermark">{{watermark}}</span>
        {{#if topic}}
        <span class="topic-tag">#{{topic}}</span>
        {{/if}}
    </div>
</body>

</html>
