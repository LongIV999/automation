<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Georgia, serif;

            background: {
                    {
                    background
                }
            }

            ;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 100px;
            position: relative;
            overflow: hidden;
        }

        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;

            background: {
                    {
                    accent
                }
            }

            ;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-text {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 36px;

            color: {
                    {
                    text
                }
            }

            ;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 48px;
        }

        .headline {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;

            font-size: {
                    {
                    headlineSize
                }
            }

            ;
            line-height: 1.1;

            color: {
                    {
                    text
                }
            }

            ;
            max-width: 95%;
        }

        .body-text {
            font-family: Georgia, serif;
            font-size: 48px;
            line-height: 1.45;

            color: {
                    {
                    textMuted
                }
            }

            ;
            max-width: 90%;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 16px;

            background: {
                    {
                    accent
                }
            }

            ;
            color: white;
            font-family: 'Roboto',
            sans-serif;
            font-weight: 700;
            font-size: 32px;
            padding: 28px 56px;
            border-radius: 16px;
            width: fit-content;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .watermark {
            font-family: 'Roboto', sans-serif;
            font-size: 28px;

            color: {
                    {
                    secondary
                }
            }

            ;
        }

        .topic-tag {
            font-family: 'Roboto', sans-serif;
            font-size: 24px;

            color: {
                    {
                    accent
                }
            }

            ;
            background: rgba(193, 95, 60, 0.1);
            padding: 14px 32px;
            border-radius: 30px;
        }

        .decor-circle {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(193, 95, 60, 0.05);
            right: -150px;
            bottom: -150px;
        }
    </style>
</head>

<body>
    <div class="accent-bar"></div>
    <div class="decor-circle"></div>

    <div class="header">
        <span class="logo-text">{{brandName}}</span>
    </div>

    <div class="content">
        <h1 class="headline">{{headline}}</h1>
        {{#if bodyText}}
        <p class="body-text">{{bodyText}}</p>
        {{/if}}
        {{#if ctaText}}
        <div class="cta">{{ctaText}}</div>
        {{/if}}
    </div>

    <div class="footer">
        <span class="watermark">{{watermark}}</span>
        {{#if topic}}
        <span class="topic-tag">#{{topic}}</span>
        {{/if}}
    </div>
</body>

</html>
