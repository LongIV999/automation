<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            font-family: 'Roboto', sans-serif;

            background: {
                    {
                    background
                }
            }

            ;
            padding: 100px;
            position: relative;
            overflow: hidden;
        }

        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 15px;

            background: {
                    {
                    accent
                }
            }

            ;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-text {
            font-weight: 700;
            font-size: 36px;

            color: {
                    {
                    text
                }
            }

            ;
        }

        .topic-tag {
            font-size: 24px;
            font-weight: 700;

            color: {
                    {
                    accent
                }
            }

            ;
            background: rgba(193, 95, 60, 0.1);
            padding: 14px 32px;
            border-radius: 40px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 80px;
            padding-bottom: 60px;
            border-bottom: 4px solid rgba(0, 0, 0, 0.08);
        }

        .title {
            font-weight: 900;
            font-size: 80px;
            line-height: 1.1;

            color: {
                    {
                    text
                }
            }

            ;
            margin-bottom: 30px;
        }

        .subtitle {
            font-family: Georgia, serif;
            font-size: 40px;

            color: {
                    {
                    textMuted
                }
            }

            ;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin-bottom: 60px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            background: white;
            padding: 48px 60px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);

            border-left: 8px solid {
                    {
                    accent
                }
            }

            ;
        }

        .stat-content {
            flex: 1;
        }

        .stat-value {
            font-weight: 900;
            font-size: 72px;

            color: {
                    {
                    accent
                }
            }

            ;
            margin-bottom: 12px;
        }

        .stat-label {
            font-size: 40px;
            font-weight: 700;

            color: {
                    {
                    text
                }
            }

            ;
        }

        .stat-desc {
            font-size: 32px;

            color: {
                    {
                    textMuted
                }
            }

            ;
            margin-top: 10px;
        }

        .insight-box {
            background: {
                    {
                    accent
                }
            }

            ;
            color: white;
            padding: 60px;
            border-radius: 24px;
            margin-bottom: 80px;
        }

        .insight-label {
            font-size: 28px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .insight-text {
            font-family: Georgia, serif;
            font-size: 42px;
            line-height: 1.45;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 50px;
            border-top: 4px solid rgba(0, 0, 0, 0.08);
        }

        .watermark {
            font-size: 32px;

            color: {
                    {
                    secondary
                }
            }

            ;
        }

        .source {
            font-size: 24px;

            color: {
                    {
                    secondary
                }
            }

            ;
        }
    </style>
</head>

<body>
    <div class="accent-bar"></div>

    <div class="header">
        <div class="logo">
            <span class="logo-text">{{brandName}}</span>
        </div>
        {{#if topic}}
        <span class="topic-tag">#{{topic}}</span>
        {{/if}}
    </div>

    <div class="title-section">
        <h1 class="title">{{title}}</h1>
        {{#if subtitle}}
        <p class="subtitle">{{subtitle}}</p>
        {{/if}}
    </div>

    <div class="stats-grid">
        {{stats}}
    </div>

    {{#if insight}}
    <div class="insight-box">
        <div class="insight-label">Key Insight</div>
        <p class="insight-text">{{insight}}</p>
    </div>
    {{/if}}

    <div class="footer">
        <span class="watermark">{{watermark}}</span>
        {{#if source}}
        <span class="source">Nguồn: {{source}}</span>
        {{/if}}
    </div>
</body>

</html>
